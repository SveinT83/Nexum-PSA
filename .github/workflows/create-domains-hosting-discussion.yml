name: Create Domains and Hosting discussion

on:
  push:
    branches:
      - automation/create-domain-hosting-discussion-20260812
    paths:
      - .github/workflows/create-domains-hosting-discussion.yml

permissions:
  contents: read
  discussions: write

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Create discussion in Ideas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_ID: R_kgDOQRzHkA
          CATEGORY_ID: DIC_kwDOQRzHkM4C7bEM
          DISCUSSION_TITLE: "Domains & Hosting: Provider-Neutral DNS, Plesk and NPMplus Management"
          DISCUSSION_BODY_B64: ""
        shell: bash
        run: |
          set -euo pipefail

          body="$(printf '%s' "$DISCUSSION_BODY_B64" | base64 --decode)"

          graphql() {
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: bearer $GH_TOKEN" \
              --header "Content-Type: application/json" \
              --url "https://api.github.com/graphql" \
              --data "$1"
          }

          check_query='query ExistingDiscussion($repositoryId: ID!) {
            node(id: $repositoryId) {
              ... on Repository {
                discussions(first: 100, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes {
                    title
                    url
                  }
                }
              }
            }
          }'

          check_payload="$(jq -n \
            --arg query "$check_query" \
            --arg repositoryId "$REPOSITORY_ID" \
            '{query: $query, variables: {repositoryId: $repositoryId}}')"

          check_response="$(graphql "$check_payload")"

          if jq -e '.errors' >/dev/null <<<"$check_response"; then
            jq -c '.errors' <<<"$check_response"
            exit 1
          fi

          existing_url="$(jq -r \
            --arg title "$DISCUSSION_TITLE" \
            '.data.node.discussions.nodes[] | select(.title == $title) | .url' \
            <<<"$check_response" | head -n 1)"

          if [[ -n "$existing_url" ]]; then
            echo "Discussion already exists: $existing_url"
            printf 'Discussion already exists: %s\n' "$existing_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mutation='mutation CreateDiscussion(
            $repositoryId: ID!,
            $categoryId: ID!,
            $title: String!,
            $body: String!
          ) {
            createDiscussion(input: {
              repositoryId: $repositoryId,
              categoryId: $categoryId,
              title: $title,
              body: $body
            }) {
              discussion {
                number
                title
                url
              }
            }
          }'

          payload="$(jq -n \
            --arg query "$mutation" \
            --arg repositoryId "$REPOSITORY_ID" \
            --arg categoryId "$CATEGORY_ID" \
            --arg title "$DISCUSSION_TITLE" \
            --arg body "$body" \
            '{query: $query, variables: {
              repositoryId: $repositoryId,
              categoryId: $categoryId,
              title: $title,
              body: $body
            }}')"

          response="$(graphql "$payload")"

          if jq -e '.errors' >/dev/null <<<"$response"; then
            jq -c '.errors' <<<"$response"
            exit 1
          fi

          discussion_url="$(jq -r '.data.createDiscussion.discussion.url' <<<"$response")"
          discussion_number="$(jq -r '.data.createDiscussion.discussion.number' <<<"$response")"

          echo "Created discussion #$discussion_number: $discussion_url"
          printf 'Created discussion #%s: %s\n' "$discussion_number" "$discussion_url" >> "$GITHUB_STEP_SUMMARY"
